name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Tests
        run: pytest -q
      - name: Example run on sample data
        run: adwatch detect --budgets data/sample/budgets.csv --as-of 2026-10-22
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-py${{ matrix.python-version }}
          path: output/
          if-no-files-found: ignore
